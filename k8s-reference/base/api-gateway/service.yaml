# =============================================================================
# k8s-reference/base/api-gateway/service.yaml
# Purpose: ClusterIP on 8080, reachable in-cluster as http://api-gateway:8080.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a Service.
# =============================================================================
apiVersion: v1
kind: Service

# =============================================================================
# Service metadata
# Purpose: Defines the Service name, namespace, and identifying labels.
# The name is the DNS name other Pods use: http://api-gateway:8080.
# It must match metadata.name on the Deployment and ServiceAccount.
# =============================================================================
metadata:
  name: api-gateway
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: gateway

# =============================================================================
# Service specification
# Purpose: Defines how traffic reaches the api-gateway Pods.
# =============================================================================
spec:

  # =============================================================================
  # Service type
  # Purpose: ClusterIP only; not reachable from the internet.
  # External traffic enters through the api-gateway Ingress / ALB instead.
  # =============================================================================
  type: ClusterIP

  # =============================================================================
  # Pod selector
  # Purpose: Identifies the Pods that receive traffic.
  # Must match the Deployment selector and Pod template labels.
  # =============================================================================
  selector:
    app.kubernetes.io/name: api-gateway

  # =============================================================================
  # Service ports
  # Purpose: Forwards Service port 8080 to containerPort 8080.
  # That targetPort must match the Deployment containerPort 8080.
  # A future Ingress / ALB should target this Service name and port.
  # =============================================================================
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
