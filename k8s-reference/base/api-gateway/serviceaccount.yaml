# =============================================================================
# k8s-reference/base/api-gateway/serviceaccount.yaml
# Purpose: Identity for the api-gateway pods. No IRSA role needed.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a ServiceAccount.
# =============================================================================
apiVersion: v1
kind: ServiceAccount

# =============================================================================
# ServiceAccount metadata
# Purpose: Defines the ServiceAccount name, namespace, and identifying labels.
# The Deployment must set serviceAccountName: api-gateway.
# No eks.amazonaws.com/role-arn annotation: this service does not call AWS APIs.
# =============================================================================
metadata:
  name: api-gateway
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: gateway
