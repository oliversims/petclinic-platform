# =============================================================================
# k8s-reference/base/api-gateway/configmap.yaml
# Purpose: Non-secret settings. Secret values arrive from ESO-synced Secrets.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a ConfigMap.
# =============================================================================
apiVersion: v1
kind: ConfigMap

# =============================================================================
# ConfigMap metadata
# Purpose: Defines the ConfigMap name, namespace, and identifying labels.
# The Deployment envFrom.configMapRef.name must be exactly api-gateway-config.
# =============================================================================
metadata:
  name: api-gateway-config
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: gateway

# =============================================================================
# ConfigMap data
# Purpose: Non-secret environment variables injected into the container.
# SERVER_PORT must match the Deployment containerPort and Service port (8080).
# CONFIG_SERVER_URL uses the config-server Service DNS name and port 8888.
# There is no Secret referenced by the api-gateway Deployment.
# =============================================================================
data:
  SERVER_PORT: "8080"
  CONFIG_SERVER_URL: "http://config-server:8888"
