# =============================================================================
# k8s-reference/base/vets-service/serviceaccount.yaml
# Purpose: Identity for the vets-service pods. No IRSA role needed.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a ServiceAccount.
# =============================================================================
apiVersion: v1
kind: ServiceAccount

# =============================================================================
# ServiceAccount metadata
# Purpose: Defines the ServiceAccount name, namespace, and identifying labels.
# The Deployment must set serviceAccountName: vets-service.
# No eks.amazonaws.com/role-arn annotation: this service does not call AWS APIs.
# =============================================================================
metadata:
  name: vets-service
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: vets-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
