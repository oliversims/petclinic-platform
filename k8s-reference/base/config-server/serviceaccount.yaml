# =============================================================================
# k8s-reference/base/config-server/serviceaccount.yaml
# Purpose: Identity for the config-server pods. No IRSA role needed.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a ServiceAccount.
# =============================================================================
apiVersion: v1
kind: ServiceAccount

# =============================================================================
# ServiceAccount metadata
# Purpose: Defines the ServiceAccount name, namespace, and identifying labels.
# The Deployment must set serviceAccountName: config-server.
# No eks.amazonaws.com/role-arn annotation: this service does not call AWS APIs.
# =============================================================================
metadata:
  name: config-server
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
