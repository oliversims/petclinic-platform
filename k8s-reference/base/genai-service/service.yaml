# =============================================================================
# k8s-reference/base/genai-service/service.yaml
# Purpose: ClusterIP on 8084, reachable in-cluster as http://genai-service:8084.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a Service.
# =============================================================================
apiVersion: v1
kind: Service

# =============================================================================
# Service metadata
# Purpose: Defines the Service name, namespace, and identifying labels.
# The name is the DNS name other Pods use: http://genai-service:8084.
# It must match metadata.name on the Deployment and ServiceAccount.
# =============================================================================
metadata:
  name: genai-service
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: genai-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service

# =============================================================================
# Service specification
# Purpose: Defines how traffic reaches the genai-service Pods.
# =============================================================================
spec:

  # =============================================================================
  # Service type
  # Purpose: ClusterIP only; not reachable from the internet.
  # External traffic enters through the api-gateway Ingress / ALB instead.
  # =============================================================================
  type: ClusterIP

  # =============================================================================
  # Pod selector
  # Purpose: Identifies the Pods that receive traffic.
  # Must match the Deployment selector and Pod template labels.
  # =============================================================================
  selector:
    app.kubernetes.io/name: genai-service

  # =============================================================================
  # Service ports
  # Purpose: Forwards Service port 8084 to containerPort 8084.
  # That targetPort must match the Deployment containerPort 8084.
  # Other services reach this name and port via Config Server / Discovery.
  # =============================================================================
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP
