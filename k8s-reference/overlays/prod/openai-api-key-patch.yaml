# =============================================================================
# k8s-reference/overlays/prod/openai-api-key-patch.yaml
# Purpose: Point the openai-api-key ExternalSecret at the prod Secrets Manager key.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines a strategic-merge patch applied by
# k8s-reference/overlays/prod/kustomization.yaml to the base ExternalSecret
# k8s/base/external-secrets/openai-api-key.yaml.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret

# =============================================================================
# Metadata: identity of the object being patched
# Purpose: Defines which ExternalSecret this patch updates. The name must match
# metadata.name in k8s/base/external-secrets/openai-api-key.yaml and the
# patches.target.name in k8s-reference/overlays/prod/kustomization.yaml.
# =============================================================================
metadata:
  name: openai-api-key

# =============================================================================
# ExternalSecret specification
# Purpose: Defines the remote key this patch overrides on the base ExternalSecret.
# =============================================================================
spec:

  # =============================================================================
  # Remote key: AWS Secrets Manager path for prod
  # Purpose: Defines the Kubernetes Secret key and the AWS secret path.
  # secretKey OPENAI_API_KEY must match the key genai-service reads in
  # k8s-reference/base/genai-service/deployment.yaml and helm-values/genai-service.yaml.
  # remoteRef.key is created by terraform/modules/secrets as
  # petclinic/{environment}/openai-api-key. The base file uses
  # petclinic/dev/openai-api-key; this patch switches it to prod.
  # =============================================================================
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: petclinic/prod/openai-api-key
