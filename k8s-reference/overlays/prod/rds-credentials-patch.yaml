# =============================================================================
# k8s-reference/overlays/prod/rds-credentials-patch.yaml
# Purpose: Point the rds-credentials ExternalSecret at the prod Secrets Manager keys.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines a strategic-merge patch applied by
# k8s-reference/overlays/prod/kustomization.yaml to the base ExternalSecret
# k8s/base/external-secrets/rds-credentials.yaml.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret

# =============================================================================
# Metadata: identity of the object being patched
# Purpose: Defines which ExternalSecret this patch updates. The name must match
# metadata.name in k8s/base/external-secrets/rds-credentials.yaml and the
# patches.target.name in k8s-reference/overlays/prod/kustomization.yaml.
# =============================================================================
metadata:
  name: rds-credentials

# =============================================================================
# ExternalSecret specification
# Purpose: Defines the remote keys this patch overrides on the base ExternalSecret.
# =============================================================================
spec:

  # =============================================================================
  # Remote keys: AWS Secrets Manager path and JSON properties for prod
  # Purpose: Defines the Kubernetes Secret keys and the AWS secret path.
  # secretKey username and password must match the keys the domain services
  # read in k8s-reference/base/customers-service/deployment.yaml (and visits-service,
  # vets-service) plus helm-values/<service>.yaml.
  # remoteRef.key is created by terraform/modules/rds as
  # petclinic/{environment}/rds-credentials. The base file uses
  # petclinic/dev/rds-credentials; this patch switches both entries to prod.
  # =============================================================================
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/prod/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/prod/rds-credentials
        property: password
