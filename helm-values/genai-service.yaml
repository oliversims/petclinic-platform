# =============================================================================
# helm-values/genai-service.yaml
# Purpose: Chat features. Single replica in prod, so no PDB.
# Merged after the chart defaults and before helm-values/{env}.yaml.
# image.registry and namespace come from the env file, not here.
# =============================================================================

# =============================================================================
# Service name
# Purpose: Helm release / Kubernetes object name for this service.
# =============================================================================
name: genai-service
# =============================================================================
# Component label
# Purpose: Value for app.kubernetes.io/component.
# =============================================================================
component: service
# =============================================================================
# Container image
# Purpose: Image repository name and tag placeholder.
# =============================================================================
image:
  name: genai-service
  tag: b9ba3c9
# =============================================================================
# Service port
# Purpose: ClusterIP and container port for genai-service.
# =============================================================================
service:
  port: 8084
# =============================================================================
# Spring profiles
# Purpose: Active Spring profiles including production.
# =============================================================================
springProfiles: "docker,production"
# =============================================================================
# ConfigMap data
# Purpose: Non-secret env keys including Zipkin tracing.
# =============================================================================
configData:
  CONFIG_SERVER_URL: "http://config-server:8888"
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin.tracing.svc:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
# =============================================================================
# Secret-backed environment variables
# Purpose: OpenAI API key from the ESO-synced Secret.
# =============================================================================
secrets:
  - name: OPENAI_API_KEY
    secretName: openai-api-key
    key: OPENAI_API_KEY
# =============================================================================
# Init containers
# Purpose: Waits for Config Server and Discovery Server before starting.
# =============================================================================
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
# =============================================================================
# Horizontal Pod Autoscaler
# Purpose: Enabled with a smaller replica range.
# =============================================================================
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
# =============================================================================
# Pod Disruption Budget
# Purpose: Disabled because genai-service runs a single replica in prod.
# =============================================================================
podDisruptionBudget:
  enabled: false
