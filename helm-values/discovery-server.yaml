# =============================================================================
# helm-values/discovery-server.yaml
# Purpose: Eureka registry. Waits for Config Server only - waiting on itself would deadlock.
# Merged after the chart defaults and before helm-values/{env}.yaml.
# image.registry and namespace come from the env file, not here.
# =============================================================================

# =============================================================================
# Service name
# Purpose: Helm release / Kubernetes object name for this service.
# =============================================================================
name: discovery-server
# =============================================================================
# Component label
# Purpose: Value for app.kubernetes.io/component.
# =============================================================================
component: server
# =============================================================================
# Container image
# Purpose: Image repository name and tag placeholder.
# =============================================================================
image:
  name: discovery-server
  tag: 946aacd
# =============================================================================
# Service port
# Purpose: ClusterIP and container port for discovery-server.
# =============================================================================
service:
  port: 8761
# =============================================================================
# Spring profiles
# Purpose: Active Spring profiles for this service.
# =============================================================================
springProfiles: "docker"
# =============================================================================
# ConfigMap data
# Purpose: Non-secret env keys for discovery-server.
# =============================================================================
configData:
  CONFIG_SERVER_URL: "http://config-server:8888"
# =============================================================================
# Init containers
# Purpose: Waits for Config Server only.
# =============================================================================
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
# =============================================================================
# Horizontal Pod Autoscaler
# Purpose: Disabled for discovery-server.
# =============================================================================
autoscaling:
  enabled: false
# =============================================================================
# Pod Disruption Budget
# Purpose: Enabled so one discovery-server pod stays available.
# =============================================================================
podDisruptionBudget:
  enabled: true
