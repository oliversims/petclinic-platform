# =============================================================================
# helm-values/config-server.yaml
# Purpose: Central configuration. Starts first, so it waits for nothing.
# Merged after the chart defaults and before helm-values/{env}.yaml.
# image.registry and namespace come from the env file, not here.
# =============================================================================

# =============================================================================
# Service name
# Purpose: Helm release / Kubernetes object name for this service.
# =============================================================================
name: config-server
# =============================================================================
# Component label
# Purpose: Value for app.kubernetes.io/component.
# =============================================================================
component: server
# =============================================================================
# Container image
# Purpose: Image repository name and tag placeholder.
# =============================================================================
image:
  name: config-server
  tag: 283828e
# =============================================================================
# Service port
# Purpose: ClusterIP and container port for config-server.
# =============================================================================
service:
  port: 8888
# =============================================================================
# Spring profiles
# Purpose: Active Spring profiles for this service.
# =============================================================================
springProfiles: "docker"
# =============================================================================
# ConfigMap data
# Purpose: Empty map; SERVER_PORT comes from service.port in the chart.
# =============================================================================
configData: {}
# =============================================================================
# Init containers
# Purpose: No dependencies; config-server starts first.
# =============================================================================
initContainers: []
# =============================================================================
# Health probes
# Purpose: Uses /actuator/health for readiness and liveness.
# =============================================================================
probes:
  readiness:
    path: /actuator/health
  liveness:
    path: /actuator/health
# =============================================================================
# Horizontal Pod Autoscaler
# Purpose: Disabled for config-server.
# =============================================================================
autoscaling:
  enabled: false
# =============================================================================
# Pod Disruption Budget
# Purpose: Enabled so one config-server pod stays available.
# =============================================================================
podDisruptionBudget:
  enabled: true
