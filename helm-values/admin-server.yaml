# =============================================================================
# helm-values/admin-server.yaml
# Purpose: Spring Boot Admin dashboard. Monitoring tooling, so no autoscaling and no PDB.
# Merged after the chart defaults and before helm-values/{env}.yaml.
# image.registry and namespace come from the env file, not here.
# =============================================================================

# =============================================================================
# Service name
# Purpose: Helm release / Kubernetes object name for this service.
# =============================================================================
name: admin-server

# =============================================================================
# Component label
# Purpose: Value for app.kubernetes.io/component.
# =============================================================================
component: admin

# =============================================================================
# Container image
# Purpose: Image repository name and tag placeholder.
# =============================================================================
image:
  name: admin-server
  tag: TAG

# =============================================================================
# Service port
# Purpose: ClusterIP and container port for admin-server.
# =============================================================================
service:
  port: 9090

# =============================================================================
# Spring profiles
# Purpose: Active Spring profiles for this service.
# =============================================================================
springProfiles: "docker"

# =============================================================================
# ConfigMap data
# Purpose: Non-secret env keys merged into the service ConfigMap.
# =============================================================================
configData:
  CONFIG_SERVER_URL: "http://config-server:8888"

# =============================================================================
# Init containers
# Purpose: Waits for Config Server and Discovery Server before starting.
# =============================================================================
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']

# =============================================================================
# Horizontal Pod Autoscaler
# Purpose: Disabled for admin-server.
# =============================================================================
autoscaling:
  enabled: false

# =============================================================================
# Pod Disruption Budget
# Purpose: Disabled for admin-server.
# =============================================================================
podDisruptionBudget:
  enabled: false
