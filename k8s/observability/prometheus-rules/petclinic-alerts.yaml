# =============================================================================
# k8s/observability/prometheus-rules/petclinic-alerts.yaml
# Purpose: The five platform alerts from the spec.
# This is a groups: fragment loaded via additionalPrometheusRulesMap.
# =============================================================================

# =============================================================================
# Prometheus rule groups
# Purpose: Defines service and workload alerting rules.
# =============================================================================
groups:
  - name: petclinic-services
    rules:

      # =============================================================================
      # ServiceDown alert
      # Purpose: Fires when a scraped target is unreachable.
      # =============================================================================
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      # =============================================================================
      # HighErrorRate alert
      # Purpose: Fires when more than 5% of responses are 5xx.
      # =============================================================================
      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{status=~"5.."}[5m])
            / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} error rate above 5%"
          description: "{{ $labels.job }} has served over 5% 5xx responses for 5 minutes."

      # =============================================================================
      # HighLatency alert
      # Purpose: Fires when p95 request latency exceeds 500ms.
      # =============================================================================
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 latency above 500ms"
          description: "{{ $labels.job }} p95 request latency has exceeded 500ms for 5 minutes."

  - name: petclinic-workloads
    rules:

      # =============================================================================
      # PodRestartLoop alert
      # Purpose: Fires when a container restarts repeatedly.
      # =============================================================================
      - alert: PodRestartLoop
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is restarting repeatedly"
          description: "Container {{ $labels.container }} restarted more than 3 times in 15 minutes."

      # =============================================================================
      # HighMemoryUsage alert
      # Purpose: Fires when working set is within 20% of the limit.
      # =============================================================================
      - alert: HighMemoryUsage
        expr: |
          container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} memory above 80% of limit"
          description: "Container {{ $labels.container }} has used over 80% of its memory limit for 5 minutes."
