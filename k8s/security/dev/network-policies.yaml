---
# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a NetworkPolicy.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

# =============================================================================
# NetworkPolicy metadata
# Purpose: Allows ingress to api-gateway on port 8080.
# =============================================================================
metadata:
  name: allow-api-gateway
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic

# =============================================================================
# NetworkPolicy specification
# Purpose: Restricts who may reach api-gateway Pods.
# =============================================================================
spec:

  # =============================================================================
  # Pod selector
  # Purpose: Selects Pods labeled app.kubernetes.io/name=api-gateway.
  # =============================================================================
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway

  # =============================================================================
  # Policy types
  # Purpose: Applies to Ingress traffic only.
  # =============================================================================
  policyTypes:
    - Ingress

  # =============================================================================
  # Ingress rules
  # Purpose: Allowed sources and TCP port 8080.
  # =============================================================================
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

