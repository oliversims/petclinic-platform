# =============================================================================
# k8s/security/dev/network-policies.yaml
# Purpose: Default-deny ingress in petclinic-dev, then one allow per service.
# ALB (VPC CIDR 10.0.0.0/16) -> api-gateway:8080
# =============================================================================

---
# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a NetworkPolicy.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

# =============================================================================
# NetworkPolicy metadata
# Purpose: Default-deny ingress for all pods in the namespace.
# =============================================================================
metadata:
  name: default-deny-ingress
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic

# =============================================================================
# NetworkPolicy specification
# Purpose: Selects all pods and denies ingress unless another policy allows it.
# =============================================================================
spec:

  # =============================================================================
  # Pod selector
  # Purpose: Empty selector matches every pod in the namespace.
  # =============================================================================
  podSelector:
    {}

  # =============================================================================
  # Policy types
  # Purpose: Applies to Ingress traffic only.
  # =============================================================================
  policyTypes:
    - Ingress

---
# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a NetworkPolicy.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

# =============================================================================
# NetworkPolicy metadata
# Purpose: Allows ingress to config-server on port 8888.
# =============================================================================
metadata:
  name: allow-config-server
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic

# =============================================================================
# NetworkPolicy specification
# Purpose: Restricts who may reach config-server Pods.
# =============================================================================
spec:

  # =============================================================================
  # Pod selector
  # Purpose: Selects Pods labeled app.kubernetes.io/name=config-server.
  # =============================================================================
  podSelector:
    matchLabels:
      app.kubernetes.io/name: config-server

  # =============================================================================
  # Policy types
  # Purpose: Applies to Ingress traffic only.
  # =============================================================================
  policyTypes:
    - Ingress

  # =============================================================================
  # Ingress rules
  # Purpose: Allowed sources and TCP port 8888.
  # =============================================================================
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8888

