# =============================================================================
# k8s/argocd/install/namespace.yaml
# Purpose: Namespace Argo CD runs in. Created before the upstream objects.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a Namespace.
# =============================================================================
apiVersion: v1
kind: Namespace

# =============================================================================
# Namespace metadata
# Purpose: Creates the argocd namespace with identifying labels.
# =============================================================================
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: argocd
