# =============================================================================
# k8s/argocd/ingress/prod.yaml
# Purpose: Dedicated ALB Ingress for the Argo CD UI on the PROD cluster.
# Apply after: kubectl apply -k k8s/argocd/install/
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as an Ingress.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress

# =============================================================================
# Ingress metadata
# Purpose: Names the Ingress and configures AWS Load Balancer Controller annotations.
# certificateArn and security-groups placeholders are replaced at apply time.
# =============================================================================
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: kubectl
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/certificate-arn: "CERT_ARN"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
    alb.ingress.kubernetes.io/security-groups: "OPS_ALB_SG_ID"
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "false"
    alb.ingress.kubernetes.io/load-balancer-name: "petclinic-prod-ops"
    alb.ingress.kubernetes.io/group.name: "petclinic-prod-ops"

# =============================================================================
# Ingress specification
# Purpose: Routes HTTPS traffic for the Argo CD UI host to argocd-server.
# =============================================================================
spec:

  # =============================================================================
  # Ingress class
  # Purpose: Uses the AWS Load Balancer Controller ALB class.
  # =============================================================================
  ingressClassName: alb

  # =============================================================================
  # Routing rules
  # Purpose: Sends argocd.DOMAIN traffic to the argocd-server Service on port 80.
  # =============================================================================
  rules:
    - host: argocd.DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
