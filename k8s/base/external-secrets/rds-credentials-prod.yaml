# =============================================================================
# k8s/base/external-secrets/rds-credentials-prod.yaml
# Purpose: Sync RDS master credentials for petclinic-prod from Secrets Manager.
# =============================================================================

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: rds-credentials
  namespace: petclinic-prod

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rds-credentials

  data:
    - secretKey: username
      remoteRef:
        key: petclinic/prod/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/prod/rds-credentials
        property: password
