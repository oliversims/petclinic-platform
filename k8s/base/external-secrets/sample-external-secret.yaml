# =============================================================================
# k8s/base/external-secrets/sample-external-secret.yaml
# Purpose: Smoke test that ESO can reach Secrets Manager through IRSA.
# Lives in external-secrets so it can be applied right after the Helm release.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this resource as an ExternalSecret.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret

# =============================================================================
# ExternalSecret metadata
# Purpose: Defines the smoke-test ExternalSecret in the external-secrets namespace.
# =============================================================================
metadata:
  name: eso-smoke-test
  namespace: external-secrets

# =============================================================================
# ExternalSecret specification
# Purpose: Controls refresh, store, target Secret, and synced keys.
# =============================================================================
spec:

  # =============================================================================
  # Refresh interval
  # Purpose: How often ESO refreshes the Kubernetes Secret from AWS.
  # =============================================================================
  refreshInterval: 1h

  # =============================================================================
  # Secret store reference
  # Purpose: Which ClusterSecretStore to use.
  # =============================================================================
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # =============================================================================
  # Target Secret
  # Purpose: Kubernetes Secret that ESO creates for the smoke test.
  # =============================================================================
  target:
    name: eso-smoke-test

  # =============================================================================
  # Synced keys
  # Purpose: Reads one property to prove IRSA and Secrets Manager access work.
  # =============================================================================
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username
