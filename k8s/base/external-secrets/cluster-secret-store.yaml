# =============================================================================
# k8s/base/external-secrets/cluster-secret-store.yaml
# Purpose: Cluster-wide link between External Secrets Operator and AWS Secrets Manager.
# Apply after the Helm release is ready - this CRD does not exist until then.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this resource as a ClusterSecretStore.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

# =============================================================================
# ClusterSecretStore metadata
# Purpose: Names the store referenced by ExternalSecret.secretStoreRef.
# =============================================================================
metadata:
  name: aws-secrets-manager

# =============================================================================
# ClusterSecretStore specification
# Purpose: Configures the AWS Secrets Manager provider and IRSA auth.
# =============================================================================
spec:

  # =============================================================================
  # AWS Secrets Manager provider
  # Purpose: Points ESO at Secrets Manager in us-east-1.
  # =============================================================================
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

      # =============================================================================
      # IRSA authentication
      # Purpose: Uses the external-secrets ServiceAccount for AWS access.
      # ServiceAccount name/namespace must match the ESO Helm release.
      # =============================================================================
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
