# =============================================================================
# k8s/base/external-secrets/rds-credentials.yaml
# Purpose: Sync RDS master credentials from Secrets Manager into a Kubernetes Secret.
# One JSON secret in AWS; remoteRef.property picks username and password.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this resource as an ExternalSecret.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret

# =============================================================================
# ExternalSecret metadata
# Purpose: Defines the ExternalSecret name and namespace.
# target.name below creates the Kubernetes Secret apps mount.
# =============================================================================
metadata:
  name: rds-credentials
  namespace: petclinic-dev

# =============================================================================
# ExternalSecret specification
# Purpose: Controls refresh, store, target Secret, and synced keys.
# =============================================================================
spec:

  # =============================================================================
  # Refresh interval
  # Purpose: How often ESO refreshes the Kubernetes Secret from AWS.
  # =============================================================================
  refreshInterval: 1h

  # =============================================================================
  # Secret store reference
  # Purpose: Which ClusterSecretStore to use.
  # Must match ClusterSecretStore.metadata.name.
  # =============================================================================
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # =============================================================================
  # Target Secret
  # Purpose: Kubernetes Secret that ESO creates and keeps in sync.
  # =============================================================================
  target:
    name: rds-credentials

  # =============================================================================
  # Synced keys
  # Purpose: Maps AWS Secrets Manager properties into Kubernetes Secret keys.
  # Deployment secretKeyRef names must match these keys.
  # =============================================================================
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: password
