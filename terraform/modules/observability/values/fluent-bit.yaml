# =============================================================================
# terraform/modules/observability/values/fluent-bit.yaml
# Purpose: Helm values for Fluent Bit - tail container logs and push them to Loki.
# =============================================================================

# =============================================================================
# Workload kind
# Purpose: Runs Fluent Bit as a DaemonSet on every node.
# =============================================================================
kind: DaemonSet

# =============================================================================
# Resources
# Purpose: CPU and memory requests/limits for Fluent Bit.
# =============================================================================
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# =============================================================================
# Fluent Bit pipeline config
# Purpose: Service, inputs, filters, and Loki output configuration.
# =============================================================================
config:

  # =============================================================================
  # Service section
  # Purpose: Fluent Bit service settings and health endpoint.
  # =============================================================================
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  # =============================================================================
  # Inputs section
  # Purpose: Tails container logs from /var/log/containers.
  # =============================================================================
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  # =============================================================================
  # Filters section
  # Purpose: Enriches logs with Kubernetes metadata.
  # =============================================================================
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  # =============================================================================
  # Outputs section
  # Purpose: Pushes logs to Loki in the monitoring namespace.
  # =============================================================================
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.monitoring.svc
        Port 3100
        Labels job=fluent-bit
        label_keys $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']
        auto_kubernetes_labels off
