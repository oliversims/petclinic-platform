# =============================================================================
# .github/workflows/update-image-tags.yml
# Purpose: Commit new image tags into helm-values/ after the app repo pushes to ECR.
# =============================================================================

# =============================================================================
# Workflow name
# Purpose: Identifies this workflow in the GitHub Actions UI.
# =============================================================================
name: update-image-tags

# =============================================================================
# Trigger events
# Purpose: Runs when the app repo dispatches app-image-built.
# =============================================================================
on:
  repository_dispatch:
    types: [app-image-built]

# =============================================================================
# Permissions
# Purpose: Allows committing updated helm-values files.
# =============================================================================
permissions:
  contents: write

# =============================================================================
# Jobs
# Purpose: Defines the tag-update job.
# =============================================================================
jobs:

  # =============================================================================
  # Update tags job
  # Purpose: Rewrites image.tag in matching helm-values files and pushes.
  # =============================================================================
  update-tags:
    name: update-tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image.tag in helm-values
        id: update
        env:
          SHA: ${{ github.event.client_payload.sha }}
          SERVICES: ${{ join(github.event.client_payload.services, ' ') }}
        run: |
          set -euo pipefail

          if [[ -z "${SHA}" || -z "${SERVICES}" ]]; then
            echo "Payload missing sha or services; nothing to do."
            exit 1
          fi

          updated=()
          for service in ${SERVICES}; do
            file="helm-values/${service}.yaml"
            if [[ ! -f "${file}" ]]; then
              echo "No values file for '${service}' (${file}) - skipping."
              continue
            fi
            yq -i ".image.tag = \"${SHA}\"" "${file}"
            updated+=("${service}")
            echo "Set image.tag=${SHA} in ${file}"
          done

          if [[ ${#updated[@]} -eq 0 ]]; then
            echo "No values files matched the payload."
            exit 1
          fi

          list=$(IFS=', '; echo "${updated[*]}")
          echo "list=${list}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push
        env:
          SHA: ${{ github.event.client_payload.sha }}
          SERVICE_LIST: ${{ steps.update.outputs.list }}
        run: |
          set -euo pipefail

          if git diff --quiet -- helm-values; then
            echo "Tags already at ${SHA}; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm-values
          git commit -m "ci: update image tags to ${SHA} (${SERVICE_LIST})"
          git push
