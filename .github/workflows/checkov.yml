# =============================================================================
# .github/workflows/checkov.yml
# Purpose: Static security scan of the platform Terraform on every change.
# =============================================================================

# =============================================================================
# Workflow name
# Purpose: Identifies this workflow in the GitHub Actions UI.
# =============================================================================
name: checkov

# =============================================================================
# Trigger events
# Purpose: Runs on pushes and PRs that touch Terraform or Checkov config.
# =============================================================================
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".checkov.yml"
      - ".github/workflows/checkov.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".checkov.yml"
      - ".github/workflows/checkov.yml"

# =============================================================================
# Permissions
# Purpose: Least-privilege token for checkout only.
# =============================================================================
permissions:
  contents: read

# =============================================================================
# Jobs
# Purpose: Defines the Checkov scan job.
# =============================================================================
jobs:

  # =============================================================================
  # Scan job
  # Purpose: Checks out the repo and runs Checkov with .checkov.yml.
  # =============================================================================
  scan:
    name: scan-terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          config_file: .checkov.yml
          soft_fail: false
          output_format: cli
