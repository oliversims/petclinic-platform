# =============================================================================
# helm/petclinic-service/templates/service.yaml
# Purpose: ClusterIP Service. In-cluster address is http://<name>:<port>.
# =============================================================================

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a Service.
# =============================================================================
apiVersion: v1
kind: Service

# =============================================================================
# Service metadata
# Purpose: Name, namespace, and labels from chart helpers.
# =============================================================================
metadata:
  name: {{ include "petclinic-service.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}

# =============================================================================
# Service specification
# Purpose: Type, selector, and ports from values.
# =============================================================================
spec:

  # =============================================================================
  # Service type
  # Purpose: Usually ClusterIP from values.
  # =============================================================================
  type: {{ .Values.service.type }}

  # =============================================================================
  # Pod selector
  # Purpose: Must match Deployment Pod template labels.
  # =============================================================================
  selector:
    {{- include "petclinic-service.selectorLabels" . | nindent 4 }}

  # =============================================================================
  # Service ports
  # Purpose: Maps Service port to container port.
  # =============================================================================
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
