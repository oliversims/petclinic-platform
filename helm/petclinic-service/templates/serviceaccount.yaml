# =============================================================================
# helm/petclinic-service/templates/serviceaccount.yaml
# Purpose: ServiceAccount for the service Pods, created when values.serviceAccount.create is true.
# =============================================================================

{{- if .Values.serviceAccount.create }}

# =============================================================================
# Kubernetes API and resource type
# Purpose: Defines this Kubernetes resource as a ServiceAccount.
# =============================================================================
apiVersion: v1
kind: ServiceAccount

# =============================================================================
# ServiceAccount metadata
# Purpose: Name, namespace, labels, and optional annotations.
# =============================================================================
metadata:
  name: {{ include "petclinic-service.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "petclinic-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
